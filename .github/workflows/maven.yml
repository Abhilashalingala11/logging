name: OOP Logging Demo CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Build with Maven
      - name: Build with Maven
        run: mvn -B clean package --file pom.xml

      # Run the OOP Logging Demo using the JAR manifest
      - name: Run OOP Logging Demo
        run: java -jar target/oop-logging-demo-1.0-SNAPSHOT.jar

      # Upload logs as artifact (use v4)
      - name: Upload log file
        uses: actions/upload-artifact@v4
        with:
          name: game-logs
          path: gameLogs.log
